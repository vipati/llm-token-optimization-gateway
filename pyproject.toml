[project]
name = "llm-token-optimization-gateway"
version = "0.1.0"
description = "LLM token optimization gateway with local model service, caching, compression, and metrics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.125.0",
    "pydantic>=2.12.0",
    "typer>=0.20.0",
    "uvicorn>=0.38.0",
]

[project.scripts]
token-gateway = "token_gateway.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=0.28.0",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/token_gateway", "src/llmapi"]
